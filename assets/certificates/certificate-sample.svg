<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Certificate placeholder</title>
  <desc id="desc">Sample certificate image placeholder for portfolio website</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="850" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="770" fill="white" stroke="#1d4ed8" stroke-width="8" rx="16"/>
  <text x="600" y="220" text-anchor="middle" font-size="58" font-family="Arial, sans-serif" fill="#111827">Certificate</text>
  <text x="600" y="300" text-anchor="middle" font-size="30" font-family="Arial, sans-serif" fill="#374151">Add your real certificate image here</text>
  <line x1="240" y1="510" x2="500" y2="510" stroke="#6b7280" stroke-width="3"/>
  <line x1="700" y1="510" x2="960" y2="510" stroke="#6b7280" stroke-width="3"/>
  <text x="370" y="545" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#4b5563">Issuer</text>
  <text x="830" y="545" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#4b5563">Date</text>
</svg>
