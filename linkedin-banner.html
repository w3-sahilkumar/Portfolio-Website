<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahil Kumar - LinkedIn Banner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", "Segoe UI", sans-serif;
      background: #0a0f16;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* LinkedIn Banner Container: 1200x627px */
    .banner {
      width: 1200px;
      height: 627px;
      background: linear-gradient(135deg, #0a0f16 0%, #101923 50%, #162535 100%);
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 60px;
    }

    /* Animated background gradient elements */
    .banner::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(124, 199, 255, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 20s ease-in-out infinite;
      z-index: 1;
    }

    .banner::after {
      content: "";
      position: absolute;
      bottom: -30%;
      left: -5%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(111, 230, 210, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: float 25s ease-in-out infinite reverse;
      z-index: 1;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(30px); }
    }

    /* Content wrapper */
    .banner-content {
      position: relative;
      z-index: 10;
      flex: 1;
      max-width: 600px;
    }

    .banner-content h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 56px;
      font-weight: 700;
      color: #edf3f9;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      line-height: 1.1;
    }

    .banner-content .subtitle {
      font-size: 20px;
      color: #7cc7ff;
      font-weight: 500;
      margin-bottom: 16px;
      font-family: "IBM Plex Mono", monospace;
      letter-spacing: 0.03em;
    }

    .banner-content p {
      font-size: 16px;
      color: #aab7c5;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    /* CTA Button */
    .cta-button {
      display: inline-block;
      padding: 12px 28px;
      background: #7cc7ff;
      color: #0a0f16;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      font-family: "IBM Plex Mono", monospace;
      border: none;
      cursor: pointer;
      transition: transform 200ms ease, box-shadow 200ms ease;
      box-shadow: 0 8px 24px rgba(124, 199, 255, 0.3);
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(124, 199, 255, 0.4);
    }

    /* Visual accent on the right */
    .banner-visual {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 60px;
    }

    .monogram-circle {
      width: 280px;
      height: 280px;
      background: linear-gradient(180deg, rgba(18, 29, 43, 0.95), rgba(9, 16, 24, 0.95));
      border: 2px solid rgba(124, 199, 255, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 20px 50px rgba(124, 199, 255, 0.2), inset 0 0 40px rgba(124, 199, 255, 0.1);
    }

    .monogram-circle::before {
      content: "";
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      border: 1px solid rgba(124, 199, 255, 0.2);
    }

    .monogram {
      font-family: "IBM Plex Mono", monospace;
      font-size: 120px;
      font-weight: 700;
      color: #7cc7ff;
      text-shadow: 0 0 30px rgba(124, 199, 255, 0.5);
      line-height: 1;
      letter-spacing: -0.1em;
      z-index: 2;
    }

    /* Responsive for smaller screens */
    @media (max-width: 1024px) {
      .banner {
        width: 100%;
        max-width: 1200px;
        padding: 40px;
        flex-direction: column;
        text-align: center;
        height: auto;
        aspect-ratio: 1200 / 627;
      }

      .banner-content {
        max-width: 100%;
        margin-bottom: 30px;
      }

      .banner-content h1 {
        font-size: 42px;
      }

      .banner-visual {
        margin-left: 0;
      }

      .monogram-circle {
        width: 200px;
        height: 200px;
      }

      .monogram {
        font-size: 80px;
      }
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="banner-content">
      <div class="subtitle">Sahil Kumar</div>
      <h1></h1>
      <p></p>
      <a href="https://github.com/w3-sahilkumar" class="cta-button">View Portfolio</a>
    </div>

    <div class="banner-visual">
      <div class="monogram-circle">
        <div class="monogram">S</div>
      </div>
    </div>
  </div>
</body>
</html>
